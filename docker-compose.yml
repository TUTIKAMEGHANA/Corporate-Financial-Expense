services:
  eureka-server:
    build: ./eureka-server
    ports: ["8761:8761"]
  auth-service:
    build: ./auth-service
    ports: ["8081:8081"]
    depends_on: [eureka-server]
  category-service:
    build: ./category-service
    ports: ["8082:8082"]
    depends_on: [eureka-server]
  expense-service:
    build: ./expense-service
    ports: ["8083:8083"]
    depends_on: [eureka-server]
  report-service:
    build: ./report-service
    ports: ["8084:8084"]
    depends_on: [eureka-server, expense-service]
  api-gateway:
    build: ./api-gateway
    ports: ["8080:8080"]
    depends_on: [eureka-server, auth-service, category-service, expense-service, report-service]
