server:
  port: 8080
spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      routes:
        - id: auth
          uri: lb://AUTH-SERVICE
          predicates: [ Path=/auth/** ]
        - id: expenses
          uri: lb://EXPENSE-SERVICE
          predicates: [ Path=/api/expenses/** ]
        - id: categories
          uri: lb://CATEGORY-SERVICE
          predicates: [ Path=/api/categories/** ]
        - id: reports
          uri: lb://REPORT-SERVICE
          predicates: [ Path=/api/reports/** ]
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
app:
  jwt:
    secret: "review-project-secret-key-must-be-at-least-32-bytes-long"
